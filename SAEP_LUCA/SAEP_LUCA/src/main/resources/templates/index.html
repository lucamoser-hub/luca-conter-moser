<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SAEP - Menu Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Almoxarifado SAEP</a>
    <div class="d-flex align-items-center">
      <span class="navbar-text me-3 text-white">Usuário: <strong th:text="${usuario.nome}"></strong></span>
      <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Sair (Logout)</a>
    </div>
  </div>
</nav>

<div class="container my-5">
  <div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
    <h1 class="display-6 fw-bold text-primary">Painel de Controle do Almoxarifado</h1>
    <p class="fs-5 text-muted">Controle de entrada, saída, cadastro e alertas de estoque mínimo.</p>
    <hr class="my-4">
    <div class="d-flex justify-content-center gap-3">
      <!-- O botão agora só aparece se o login exato for "admin" -->
      <a th:href="@{/produtos}" class="btn btn-primary btn-lg px-4" th:if="${usuario.login == 'admin'}">
        Cadastro de Produtos</a>

      <a th:href="@{/estoque}" class="btn btn-success btn-lg px-4">Gestão de Estoque</a>
    </div>
  </div>
</div>
</body>
</html>
