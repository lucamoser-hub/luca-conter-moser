<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SAEP - Cadastro de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxarifado SAEP</a>
    <span class="navbar-text text-white">Operador: <strong th:text="${usuario.nome}"></strong></span>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Cadastro de Produtos</h2>
    <div>
      <a th:href="@{/produtos/novo}" class="btn btn-primary">+ Novo Produto</a>
      <a th:href="@{/principal}" class="btn btn-secondary">Voltar ao Menu</a>
    </div>
  </div>

  <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

  <form th:action="@{/produtos}" method="get" class="row g-2 mb-4">
    <div class="col-md-9">
      <input type="text" name="termo" class="form-control" placeholder="Buscar por código, nome ou categoria..." th:value="${termo}">
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-dark w-100">Pesquisar</button>
    </div>
  </form>

  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-dark">
      <tr>
        <th>Código</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Especificações</th>
        <th>Peso (kg)</th>
        <th>Estoque</th>
        <th>Estoque Mín.</th>
        <th>Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${produtos}">
        <td th:text="${p.codigo}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.categoria}"></td>
        <td th:text="${p.especificacoes}"></td>
        <td th:text="${p.pesoKg}"></td>
        <td>
                    <span th:text="${p.quantidadeEstoque}"
                          th:classappend="${p.quantidadeEstoque < p.estoqueMinimo} ? 'badge bg-danger' : 'badge bg-success'">
                    </span>
        </td>
        <td th:text="${p.estoqueMinimo}"></td>
        <td>
          <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
          <a th:href="@{/produtos/excluir/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmar exclusão?')">Excluir</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(produtos)}">
        <td colspan="8" class="text-center text-muted py-3">Nenhum produto encontrado.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
