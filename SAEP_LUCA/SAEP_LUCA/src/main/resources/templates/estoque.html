<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SAEP - Gestão de Estoque</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxarifado SAEP</a>
    <span class="navbar-text text-white">Usuário: <strong th:text="${usuario.nome}"></strong></span>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestão de Movimentação de Estoque</h2>
    <a th:href="@{/principal}" class="btn btn-secondary">Voltar ao Menu</a>
  </div>

  <div th:if="${alertaMinimo}" class="alert alert-warning border-2 border-danger alert-dismissible fade show fw-bold text-dark" role="alert">
    <span th:text="${alertaMinimo}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${sucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${erro}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-success text-white fw-bold">Lançamento de Entrada / Saída</div>
    <div class="card-body">
      <form th:action="@{/estoque/movimentar}" method="post" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Produto (Ordenado Alfabeticamente):</label>
          <select name="produtoId" class="form-select" required>
            <option value="">-- Selecione o Produto --</option>
            <option th:each="p : ${produtos}"
                    th:value="${p.id}"
                    th:text="${p.nome + ' (Atual: ' + p.quantidadeEstoque + ' | Mín: ' + p.estoqueMinimo + ')'}">
            </option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Tipo:</label>
          <select name="tipo" class="form-select" required>
            <option value="ENTRADA">ENTRADA</option>
            <option value="SAIDA">SAÍDA</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Quantidade:</label>
          <input type="number" min="1" name="quantidade" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Data e Hora:</label>
          <!-- AQUI ESTÁ A MÁGICA DO BLOQUEIO DE DATA: min="2026-01-01T00:00" -->
          <input type="datetime-local" name="dataMovimentacao" class="form-control" min="2026-01-01T00:00">
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <h4 class="mb-3">Histórico de Movimentações</h4>
  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-dark">
      <tr>
        <th>Data/Hora</th>
        <th>Produto</th>
        <th>Tipo</th>
        <th>Quantidade</th>
        <th>Responsável</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="h : ${historico}">
        <td th:text="${#temporals.format(h.dataMovimentacao, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${h.produto.nome}"></td>
        <td>
                    <span th:text="${h.tipo}"
                          th:classappend="${h.tipo.name() == 'ENTRADA'} ? 'badge bg-success' : 'badge bg-danger'">
                    </span>
        </td>
        <td th:text="${h.quantidade}"></td>
        <td th:text="${h.usuario.nome}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(historico)}">
        <td colspan="5" class="text-center text-muted py-3">Nenhuma movimentação registrada.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- O erro estava aqui: troquei "href=" por "src=" para os alertas funcionarem -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
