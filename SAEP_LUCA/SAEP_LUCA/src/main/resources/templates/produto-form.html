<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SAEP - Formulário de Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-4" style="max-width: 800px;">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0" th:text="${produto.id == null} ? 'Cadastrar Novo Produto' : 'Editar Produto'"></h4>
    </div>
    <div class="card-body">
      <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Código *</label>
            <input type="text" th:field="*{codigo}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{codigo}"></div>
          </div>
          <div class="col-md-8">
            <label class="form-label">Nome do Produto *</label>
            <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Categoria *</label>
            <input type="text" th:field="*{categoria}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{categoria}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Material do Cabo</label>
            <input type="text" th:field="*{materialCabo}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Material da Cabeça</label>
            <input type="text" th:field="*{materialCabeca}" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Especificações Técnicas (Ex: Ponta Imantada, Isolamento 1000V)</label>
          <input type="text" th:field="*{especificacoes}" class="form-control">
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Peso (kg) *</label>
            <input type="number" step="0.001" th:field="*{pesoKg}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{pesoKg}"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tamanho (mm) *</label>
            <input type="number" step="0.1" th:field="*{tamanhoMm}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tamanhoMm}"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Qtd. Estoque *</label>
            <input type="number" th:field="*{quantidadeEstoque}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{quantidadeEstoque}"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Estoque Mínimo *</label>
            <input type="number" th:field="*{estoqueMinimo}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{estoqueMinimo}"></div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-success">Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
